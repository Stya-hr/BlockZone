plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run/data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {

    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.izzel.io/releases/'
        content { includeGroup 'icyllis.modernui' }
    }
    // The 1.3.0 Forge snapshot is a GitHub release asset without Maven metadata.
    ivy {
        url = 'https://github.com/PhasetransCrystal/FPSMatch/releases/download'
        patternLayout {
            artifact '[revision]/[artifact].jar'
        }
        metadataSources { artifact() }
        content { includeGroup 'github.release.fpsmatch' }
    }
}

jarJar.enable()

dependencies {
    implementation(jarJar('com.github.weisj:jsvg:2.2.0')) {
        jarJar.ranged(it, '[2.2.0,2.3.0)')
    }
    minecraftLibrary 'com.github.weisj:jsvg:2.2.0'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // FPSMatch/TaCZ already supply MixinExtras at runtime; only expose its API to the compiler.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    implementation fg.deobf("github.release.fpsmatch:fpsmatch-1.20.1-1.3.0-forge-snapshot:${fpsmatch_snapshot_tag}")
    runtimeOnly fg.deobf("maven.modrinth:kotlin-for-forge:${kotlin_forge_version}")
    runtimeOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    compileOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    // Optional accessory API; never require Curios for a standalone installation.
    compileOnly fg.deobf('maven.modrinth:curios:IPQlZkz1')
    runtimeOnly fg.deobf("icyllis.modernui:ModernUI-Forge:${minecraft_version}-${modernui_forge_version}")
    // Core libraries must be visible to Forge's game class loader.
    minecraftLibrary("icyllis.modernui:ModernUI-Core:${modernui_core_version}") {
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'com.ibm.icu', module: 'icu4j'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
    minecraftLibrary("icyllis.modernui:ModernUI-Markflow:${modernui_core_version}") {
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'com.ibm.icu', module: 'icu4j'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            fpsmatch_version: fpsmatch_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'MixinConfigs'           : 'mixins.blockzone.json',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// BlockZone test, Mixin and resource-pack configuration.
tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') standardInput = System.in
}

mixin {
    add sourceSets.main, 'mixins.blockzone.refmap.json'
    config 'mixins.blockzone.json'
}

// Export client assets from the same source used by the mod.
tasks.register('resourcePack', Zip) {
    archiveFileName = 'blockzone-resourcepack.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/resources') {
        include 'pack.mcmeta', 'assets/**'
    }
}

reobf {
    jarJar {}
}

tasks.named('jarJar') {
    finalizedBy 'reobfJarJar'
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('resourcePack')
}
