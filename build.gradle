plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client { workingDirectory project.file('run/client') }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
        }
        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.izzel.io/releases/'
        content { includeGroup 'icyllis.modernui' }
    }
    // The 1.3.0 Forge snapshot is a GitHub release asset without Maven metadata.
    ivy {
        url = 'https://github.com/PhasetransCrystal/FPSMatch/releases/download'
        patternLayout {
            artifact '[revision]/[artifact].jar'
        }
        metadataSources { artifact() }
        content { includeGroup 'github.release.fpsmatch' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    implementation fg.deobf("github.release.fpsmatch:fpsmatch-1.20.1-1.3.0-forge-snapshot:${fpsmatch_snapshot_tag}")
    runtimeOnly fg.deobf("maven.modrinth:kotlin-for-forge:${kotlin_forge_version}")
    runtimeOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    compileOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    runtimeOnly fg.deobf("icyllis.modernui:ModernUI-Forge:${minecraft_version}-${modernui_forge_version}")
    runtimeOnly "icyllis.modernui:ModernUI-Core:${modernui_core_version}"
    runtimeOnly "icyllis.modernui:ModernUI-Markflow:${modernui_core_version}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('processResources', ProcessResources) {
    def replacements = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_license: mod_license, mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            fpsmatch_version: fpsmatch_version
    ]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') standardInput = System.in
}

mixin {
    add sourceSets.main, 'mixins.blockzone.refmap.json'
    config 'mixins.blockzone.json'
}
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes(['MixinConfigs': 'mixins.blockzone.json'])
    finalizedBy 'reobfJar'
}

// Export the same complete pack that is bundled inside the mod.
tasks.register('resourcePack', Zip) {
    archiveFileName = 'blockzone-resourcepack.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/resources/resourcepacks/blockzone')
}

tasks.named('assemble') {
    dependsOn tasks.named('resourcePack')
}
